name: フィード更新とデプロイ

# 定期的な更新は「自動更新タイマー」（timer.yml）がこのワークフローを実行する。
# （GitHub の定期実行 schedule は新しいリポジトリだと動かないことがあるため使わない）
on:
  push:
    # 開発記録や説明書きだけの変更では、収集・公開をやり直さない（自動更新タイマーの間隔も崩さない）
    paths-ignore:
      - '**.md'
      - 'docs/**'
  # 自動更新タイマー、管理画面の「今すぐ更新」ボタン、Actions 画面の Run workflow から実行
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

env:
  ASTRO_TELEMETRY_DISABLED: 1

jobs:
  build:
    # 公開は既定ブランチだけ
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      base_url: ${{ steps.target.outputs.base_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            analytics/package-lock.json

      - run: npm ci

      - name: テスト・型チェック
        run: |
          npm test
          npm run check

      - id: pages
        uses: actions/configure-pages@v6

      # 公開先を決める。Cloudflare の Secrets があれば Cloudflare Pages（pages.dev。アクセス解析つき）に公開し、
      # 以前の公開先の GitHub Pages は新しい URL への転送ページにする。Secrets がなければ、これまでどおり GitHub Pages に公開する
      - name: 公開先を決める
        id: target
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # ルートの wrangler.jsonc の name と同じにする
          PROJECT: topiatsume
          PAGES_ORIGIN: ${{ steps.pages.outputs.origin }}
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
          # 独自ドメインを Cloudflare Pages に付けたときは、変数 SITE_URL にその URL（例: https://example.com）を入れる
          CUSTOM_SITE_URL: ${{ vars.SITE_URL }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo '::notice::Cloudflare の Secrets がないため、GitHub Pages に公開します'
            { echo 'cloudflare=false'; echo "site_url=$PAGES_ORIGIN"; echo "base_path=$PAGES_BASE_PATH"; echo "base_url=$PAGES_BASE_URL"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          # Pages のプロジェクトがなければ作る（本番のブランチは main。公開のときに --branch main を付ける）
          if ! res=$(curl -fsS "$api/pages/projects/$PROJECT" -H "$auth"); then
            res=$(curl -fsS -X POST "$api/pages/projects" -H "$auth" -H 'Content-Type: application/json' \
              -d "{\"name\":\"$PROJECT\",\"production_branch\":\"main\"}") || true
          fi
          host=$(printf '%s' "$res" | jq -r '.result.subdomain // empty')
          if [ -z "$host" ]; then
            echo '::error::Cloudflare Pages のプロジェクトを確かめられませんでした。トークンの権限（Cloudflare Pages の編集）と Account ID を確認してください'
            exit 1
          fi
          # アクセス解析の Durable Object を持つ Worker（analytics/）がまだなければ、先に公開する（サイトの /api が使う）
          if curl -fsS -o /dev/null "$api/workers/scripts/topiatsume-analytics/settings" -H "$auth"; then
            echo 'analytics_worker=ready' >> "$GITHUB_OUTPUT"
          else
            echo 'analytics_worker=missing' >> "$GITHUB_OUTPUT"
          fi
          site="${CUSTOM_SITE_URL%/}"
          [ -n "$site" ] || site="https://$host"
          { echo 'cloudflare=true'; echo "project=$PROJECT"; echo "site_url=$site"; echo 'base_path=/'; echo "base_url=$site"; echo 'analytics=/api'; } >> "$GITHUB_OUTPUT"
          echo "公開先: $site"

      - name: フィードを取得
        run: npm run fetch

      # 管理画面から依頼された「AI が開けない記事」の本文を取得する（フィードと同じブラウザ相当の通信で、robots.txt・AI での
      # 利用の拒否・アクセスの拒否を守る。本文は運営者の公開鍵で暗号化して data/texts.json に置く）。失敗しても収集・公開は続ける
      - name: AI が開けない記事の本文を取得
        continue-on-error: true
        run: npm run texts

      # アクセス解析（Cloudflare に公開しているとき）から、よく読まれている記事を取ってくる（data/popular.json）
      - name: よく読まれている記事を取得
        continue-on-error: true
        run: npm run popular
        env:
          PUBLIC_ANALYTICS_URL: ${{ steps.target.outputs.analytics || vars.PUBLIC_ANALYTICS_URL }}
          SITE_URL: ${{ steps.target.outputs.site_url }}

      - name: 取得したデータをコミット
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # 取得結果を退避し、ブランチの最新状態に取り込み直してから push する。
          # （再実行や同時更新で古いコミットから始まっても、データが衝突しない）
          cp data/items.json "$RUNNER_TEMP/fetched-items.json"
          # 収集元ごとの取得状態（ETag・連続失敗の回数など）は、今回の取得結果で上書きする
          cp data/feeds.json "$RUNNER_TEMP/feeds.json"
          # 本文の自動取得の結果は、最新の data/texts.json にまとめる（同じ記事は新しく取得した方を残す）
          if [ -f data/texts.json ]; then cp data/texts.json "$RUNNER_TEMP/texts.json"; fi
          # よく読まれている記事は、今回取ってきたもので上書きする
          if [ -f data/popular.json ]; then cp data/popular.json "$RUNNER_TEMP/popular.json"; fi
          for attempt in 1 2 3; do
            git fetch --quiet origin "$GITHUB_REF_NAME"
            git reset --quiet --hard "origin/$GITHUB_REF_NAME"
            git diff --quiet "$GITHUB_SHA" HEAD -- package-lock.json || npm ci
            npm run --silent merge -- "$RUNNER_TEMP/fetched-items.json"
            cp "$RUNNER_TEMP/feeds.json" data/feeds.json
            if [ -f "$RUNNER_TEMP/texts.json" ]; then npm run --silent texts -- --merge "$RUNNER_TEMP/texts.json"; fi
            if [ -f "$RUNNER_TEMP/popular.json" ]; then cp "$RUNNER_TEMP/popular.json" data/popular.json; fi
            git add data
            if git diff --cached --quiet; then
              echo '更新なし'
              echo 'changed=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git commit --quiet -m 'chore: フィードを更新'
            if git push --quiet origin "HEAD:$GITHUB_REF_NAME"; then
              echo 'changed=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep $((attempt * 5))
          done
          echo 'データのコミットに失敗しました' >&2
          exit 1

      - name: サイトをビルド
        run: npm run build
        env:
          SITE_URL: ${{ steps.target.outputs.site_url }}
          BASE_PATH: ${{ steps.target.outputs.base_path }}
          PUBLIC_ADSENSE_CLIENT: ${{ vars.PUBLIC_ADSENSE_CLIENT }}
          PUBLIC_ADSENSE_SLOT: ${{ vars.PUBLIC_ADSENSE_SLOT }}
          PUBLIC_GA_ID: ${{ vars.PUBLIC_GA_ID }}
          PUBLIC_GOOGLE_SITE_VERIFICATION: ${{ vars.PUBLIC_GOOGLE_SITE_VERIFICATION }}
          PUBLIC_BING_SITE_VERIFICATION: ${{ vars.PUBLIC_BING_SITE_VERIFICATION }}
          PUBLIC_ANALYTICS_URL: ${{ steps.target.outputs.analytics || vars.PUBLIC_ANALYTICS_URL }}

      - name: Cloudflare Pages に公開
        if: steps.target.outputs.cloudflare == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ steps.target.outputs.project }}
          ANALYTICS_WORKER: ${{ steps.target.outputs.analytics_worker }}
        run: |
          npm ci --prefix analytics --no-audit --no-fund
          if [ "$ANALYTICS_WORKER" = 'missing' ]; then
            (cd analytics && npx wrangler deploy --var "REPOSITORY:$GITHUB_REPOSITORY")
          fi
          # dist（静的なページ）と functions/（サイトの /api）を公開する。設定はルートの wrangler.jsonc
          analytics/node_modules/.bin/wrangler pages deploy --project-name "$PROJECT" --branch main \
            --commit-hash "$(git rev-parse HEAD)" --commit-message "update $(date -u +%Y-%m-%dT%H:%MZ)" --commit-dirty=true

      - name: GitHub Pages を新しい公開先への転送ページにする
        if: steps.target.outputs.cloudflare == 'true'
        env:
          SITE_URL: ${{ steps.target.outputs.site_url }}
          OLD_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: node scripts/redirect-stub.mjs "$SITE_URL" "$OLD_BASE_PATH" gh-pages

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ steps.target.outputs.cloudflare == 'true' && 'gh-pages' || 'dist' }}

  # 収集（build）は同時に動いてもデータのコミットが衝突しないので並行させ、公開だけを1つずつ行う。
  # （同じ concurrency group で待っている実行は、次の実行が来ると取り消されるため、
  #   管理画面の「今すぐ更新」が定期実行に取り消されないよう build には付けない）
  deploy:
    needs: build
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # 自動更新タイマー（timer.yml）が止まっていたら再開する。更新が動くたびに確かめる
  keep-timer:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # タイマーの確認に失敗しても、収集・公開の結果（成功）には影響させない
    continue-on-error: true
    permissions:
      actions: write
      contents: read
    steps:
      - name: 自動更新タイマーを確認・再開
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)" = "true" ]; then
            echo '非公開リポジトリでは自動更新タイマーを使いません'
            exit 0
          fi
          active=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/timer.yml/runs?per_page=10" \
            --jq '[.workflow_runs[] | select(.status != "completed")] | length')
          if [ "$active" -gt 0 ]; then
            echo '自動更新タイマーは動いています'
          else
            gh workflow run timer.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
            echo '自動更新タイマーが止まっていたので再開しました' | tee -a "$GITHUB_STEP_SUMMARY"
          fi

  # 公開後に検索エンジン（IndexNow）・フィード購読者（WebSub）へ更新を知らせ、SNS に自動投稿する
  notify:
    needs: [build, deploy]
    # 同じまとめを二重に投稿しないよう、通知・SNS 投稿も1つずつ
    concurrency:
      group: notify
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # build ジョブがコミットした最新のデータを使う
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: 更新を通知・SNS に投稿
        run: npm run notify
        env:
          SITE_BASE_URL: ${{ needs.build.outputs.base_url }}
          DATA_CHANGED: ${{ needs.build.outputs.changed }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          BLUESKY_IDENTIFIER: ${{ secrets.BLUESKY_IDENTIFIER }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          MASTODON_URL: ${{ secrets.MASTODON_URL }}
          MASTODON_TOKEN: ${{ secrets.MASTODON_TOKEN }}
          MISSKEY_URL: ${{ secrets.MISSKEY_URL }}
          MISSKEY_TOKEN: ${{ secrets.MISSKEY_TOKEN }}

      - name: 投稿の記録をコミット
        run: |
          [ -f data/social.json ] || exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cp data/social.json "$RUNNER_TEMP/social.json"
          for attempt in 1 2 3; do
            git fetch --quiet origin "$GITHUB_REF_NAME"
            git reset --quiet --hard "origin/$GITHUB_REF_NAME"
            cp "$RUNNER_TEMP/social.json" data/social.json
            git add data/social.json
            git diff --cached --quiet && exit 0
            git commit --quiet -m 'chore: SNS 投稿の記録を更新'
            git push --quiet origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep $((attempt * 5))
          done
          exit 1
