name: SNS に投稿（更新の合間）

# 収集・公開（update.yml）の合間に、SNS（Bluesky など）への投稿だけを行う（収集・ビルド・公開はしない）。
# 自動更新タイマー（timer.yml）が、前回の更新の30分後（リポジトリの変数 SOCIAL_INTERVAL_MINUTES で変えられる）に実行する。
# 更新のあとの投稿（update.yml の notify）と合わせて、30分ごとに投稿する。
# 投稿する内容は、公開しているサイトと同じデータ（リポジトリの data/）から決めるので、リンク先のページはすでに公開されている。
# 深夜は投稿しない・前の投稿から間をあける・1日の上限などは scripts/lib/social.ts の SOCIAL_LIMITS のとおり
on:
  # 自動更新タイマー、Actions 画面の Run workflow から実行
  workflow_dispatch:

permissions:
  # 投稿の記録（data/social.json）をコミットする
  contents: write

jobs:
  post:
    # 投稿は既定ブランチだけ（ref_name だと、同じ名前のタグでも当てはまるので refs/heads/ で比べる）
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    # 同じ話題を二重に投稿しないよう、update.yml の通知・SNS 投稿（notify）と1つずつ実行する
    concurrency:
      group: notify
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # 投稿の記録（data/social.json）を含む最新のデータを使う
          ref: ${{ github.ref_name }}
          # GitHub のトークンを .git に残さない（push は「投稿の記録をコミット」で、そのときだけ渡す。2026-10-24 のセキュリティの点検）
          persist-credentials: false

      - name: リポジトリを復号（git-crypt）
        env:
          REPO_KEY: ${{ secrets.REPO_KEY }}
        run: |
          if [ -z "$REPO_KEY" ]; then
            echo '::error::Secrets に REPO_KEY（git-crypt の鍵を base64 にしたもの）がありません。登録しないと復号できず、収集・公開ができません'
            exit 1
          fi
          sudo apt-get update -qq && sudo apt-get install -y -qq git-crypt
          printf '%s' "$REPO_KEY" | base64 -d > "$RUNNER_TEMP/repo.key"
          git-crypt unlock "$RUNNER_TEMP/repo.key"
          rm -f "$RUNNER_TEMP/repo.key"

      # 暗号化されているはずのファイルに、平文のファイルが差し込まれていないかを確かめる（update.yml と同じ。git-crypt は平文のファイルを
      # そのまま通すので、リポジトリに書き込めるトークンがあれば、鍵なしでコードを差し込めてしまうため。2026-10-24 のセキュリティの点検）。
      # 平文で置いてよいものは .gitattributes と同じだが、.gitattributes も書き換えられるので、ここに直接書く
      - name: 暗号化されていないファイルがないか確かめる
        run: |
          bad=''
          while IFS= read -r -d '' entry; do
            path=${entry#*$'\t'}
            case "$path" in data/* | .github/* | .claude/* | CLAUDE.md | .gitattributes | .gitignore | */.gitattributes | */.gitignore) continue ;; esac
            rest=${entry#* }
            [ "$(git cat-file blob "${rest%% *}" 2>/dev/null | head -c 10 | tr -d '\000')" = GITCRYPT ] || bad="$bad $path"
          done < <(git ls-files -s -z)
          if [ -n "$bad" ]; then
            echo "::error::暗号化されていないファイルがあります（差し込まれたおそれがあるため止めます）:$bad"
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # 依存パッケージのインストールのスクリプトは動かさない（update.yml と同じ）
      - run: npm ci --ignore-scripts

      # 投稿のリンク先（update.yml の「公開先を決める」と同じ。Cloudflare Pages。独自ドメインなら変数 SITE_URL）
      - name: 公開先の URL を調べる
        id: target
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # update.yml の PROJECT（ルートの wrangler.jsonc の name）と同じ
          PROJECT: topiatsume
          CUSTOM_SITE_URL: ${{ vars.SITE_URL }}
        run: |
          site=''
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            site="${CUSTOM_SITE_URL%/}"
            if [ -z "$site" ]; then
              host=$(curl -fsS "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT" \
                -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | jq -r '.result.subdomain // empty') || host=''
              [ -z "$host" ] || site="https://$host"
            fi
          fi
          if [ -z "$site" ]; then
            echo '::warning::公開先の URL がわからないため、今回は投稿しません'
            exit 0
          fi
          echo "base_url=${site%/}" >> "$GITHUB_OUTPUT"
          echo "公開先: ${site%/}"

      - name: SNS に投稿
        if: steps.target.outputs.base_url != ''
        run: npm run notify
        env:
          SITE_BASE_URL: ${{ steps.target.outputs.base_url }}
          # 検索エンジン・フィードへの通知は、更新のあと（update.yml）だけで行う
          NOTIFY_SKIP_PING: '1'
          # Bluesky のアカウント（update.yml と同じ。パスワードは Secrets の BLUESKY_APP_PASSWORD だけ）
          BLUESKY_IDENTIFIER: ${{ secrets.BLUESKY_IDENTIFIER || vars.BLUESKY_IDENTIFIER || 'topiatsume.bsky.social' }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          MASTODON_URL: ${{ secrets.MASTODON_URL }}
          MASTODON_TOKEN: ${{ secrets.MASTODON_TOKEN }}
          MISSKEY_URL: ${{ secrets.MISSKEY_URL }}
          MISSKEY_TOKEN: ${{ secrets.MISSKEY_TOKEN }}

      - name: 投稿の記録をコミット
        if: steps.target.outputs.base_url != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f data/social.json ] || exit 0
          # 今回投稿していなければ（記録が変わっていなければ）何もしない（ほかで更新された記録を古い内容で上書きしないため）
          [ -z "$(git status --porcelain -- data/social.json)" ] && exit 0
          # トークンは git の fetch・push のときだけ使う
          git_auth() {
            GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
              GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" git "$@"
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cp data/social.json "$RUNNER_TEMP/social.json"
          for attempt in 1 2 3; do
            git_auth fetch --quiet origin "$GITHUB_REF_NAME"
            git reset --quiet --hard "origin/$GITHUB_REF_NAME"
            cp "$RUNNER_TEMP/social.json" data/social.json
            git add data/social.json
            git diff --cached --quiet && exit 0
            git commit --quiet -m 'chore: SNS 投稿の記録を更新'
            git_auth push --quiet origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep $((attempt * 5))
          done
          exit 1
