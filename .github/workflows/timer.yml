name: 自動更新タイマー

# 一定時間（既定60分）ごとに収集・公開（update.yml）を実行する。
# GitHub の定期実行（schedule）は新しいリポジトリだと動かないことがあるため、このワークフローが
# 「前回の更新から60分たつまで待つ → update.yml を実行 → 自分自身を次に予約」を繰り返す。
# 待っている間に、前回の更新から30分たったら SNS の投稿だけ（social.yml）も実行する（投稿を30分ごとにするため。深夜は実行しない）。
# 止まっても、update.yml が動くたびに（push・管理画面の「今すぐ更新」など）自動で再開する。
# 待っている間も Actions の実行時間を使うので、公開リポジトリ（実行時間が無料）でだけ動く。
on:
  workflow_dispatch:
  schedule:
    # 予備: GitHub の定期実行が動く場合は、止まったタイマーをここからも再開する
    - cron: '41 */3 * * *'

permissions:
  actions: write
  contents: read

# タイマーは常に1つだけ（待機中に別の実行が来たら、新しい方が順番を待つ）
concurrency:
  group: auto-update-timer
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v7
        with:
          # push しないので、GitHub のトークンを .git に残さない（2026-10-13 のセキュリティの点検 L5）
          persist-credentials: false

      - name: リポジトリを復号（git-crypt）
        env:
          REPO_KEY: ${{ secrets.REPO_KEY }}
        run: |
          if [ -z "$REPO_KEY" ]; then
            echo '::error::Secrets に REPO_KEY（git-crypt の鍵を base64 にしたもの）がありません。登録しないと復号できず、収集・公開ができません'
            exit 1
          fi
          sudo apt-get update -qq && sudo apt-get install -y -qq git-crypt
          printf '%s' "$REPO_KEY" | base64 -d > "$RUNNER_TEMP/repo.key"
          git-crypt unlock "$RUNNER_TEMP/repo.key"
          rm -f "$RUNNER_TEMP/repo.key"

      # 暗号化されているはずのファイルに、平文のファイルが差し込まれていないかを確かめる（update.yml と同じ。git-crypt は平文のファイルを
      # そのまま通すので、リポジトリに書き込めるトークンがあれば、鍵なしでコードを差し込めてしまうため。2026-10-24 のセキュリティの点検）。
      # 平文で置いてよいものは .gitattributes と同じだが、.gitattributes も書き換えられるので、ここに直接書く
      - name: 暗号化されていないファイルがないか確かめる
        run: |
          bad=''
          while IFS= read -r -d '' entry; do
            path=${entry#*$'\t'}
            case "$path" in data/* | .github/* | .claude/* | CLAUDE.md | .gitattributes | .gitignore | */.gitattributes | */.gitignore) continue ;; esac
            rest=${entry#* }
            [ "$(git cat-file blob "${rest%% *}" 2>/dev/null | head -c 10 | tr -d '\000')" = GITCRYPT ] || bad="$bad $path"
          done < <(git ls-files -s -z)
          if [ -n "$bad" ]; then
            echo "::error::暗号化されていないファイルがあります（差し込まれたおそれがあるため止めます）:$bad"
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # 依存パッケージのインストールのスクリプトは動かさない（update.yml と同じ）
      - run: npm ci --ignore-scripts

      - name: 前回の更新から待って、収集・公開を実行
        run: npm run --silent timer
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # 更新の間隔（分）を変えるときは、リポジトリの変数 UPDATE_INTERVAL_MINUTES を設定する（15〜360）
          UPDATE_INTERVAL_MINUTES: ${{ vars.UPDATE_INTERVAL_MINUTES }}
          # SNS の投稿の間隔（分）を変えるときは、リポジトリの変数 SOCIAL_INTERVAL_MINUTES を設定する（15〜360。0 で更新の合間の投稿をやめる）
          SOCIAL_INTERVAL_MINUTES: ${{ vars.SOCIAL_INTERVAL_MINUTES }}

      # 一時的な失敗（npm や GitHub API の不調など）で止まらないよう、少し待ってから次のタイマーを予約する。
      # 失敗が3回続いているときは、繰り返さないよう止める（update.yml が動けば自動で再開する）
      - name: 失敗したときは5分後にタイマーを再開
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          failures=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/timer.yml/runs?per_page=3&status=completed" \
            --jq '[.workflow_runs[] | select(.conclusion == "failure")] | length')
          if [ "$failures" -ge 3 ]; then
            echo '::warning::自動更新タイマーの失敗が続いているため、再開しません'
            exit 0
          fi
          sleep 300
          gh workflow run timer.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
