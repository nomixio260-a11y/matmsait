name: アクセス解析のサーバーを公開

# アクセス解析の Durable Object を持つ Worker（analytics/）を Cloudflare Workers（無料プラン）に公開する。
# サイト（Cloudflare Pages）の /api（functions/）がこの Durable Object を使う。Worker 自体は workers.dev では公開しない。
# 使うには、リポジトリの Secrets に CLOUDFLARE_API_TOKEN と CLOUDFLARE_ACCOUNT_ID を登録する（README の「公開先」）。
# 登録していなければ何もしない（サイトの公開（update.yml）も、Worker がまだなければ先に公開する）
on:
  push:
    paths:
      - 'analytics/**'
      - '.github/workflows/analytics.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: analytics-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Cloudflare の設定を確認
        id: config
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo '::notice::Secrets に CLOUDFLARE_API_TOKEN と CLOUDFLARE_ACCOUNT_ID が登録されていないため、アクセス解析のサーバーは公開しません'
            echo 'ready=false' >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.config.outputs.ready == 'true'

      - uses: actions/setup-node@v7
        if: steps.config.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: analytics/package-lock.json

      - name: 準備・型チェック
        if: steps.config.outputs.ready == 'true'
        working-directory: analytics
        run: |
          npm ci
          npm run check

      - name: 公開
        if: steps.config.outputs.ready == 'true'
        working-directory: analytics
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # 独自ドメインにしたとき（変数 SITE_URL）は、通知の送り主の連絡先もそちらにする
          CUSTOM_SITE_URL: ${{ vars.SITE_URL }}
        run: |
          if [ -n "$CUSTOM_SITE_URL" ]; then
            npx wrangler deploy --var "REPOSITORY:$GITHUB_REPOSITORY" --var "SITE_URL:${CUSTOM_SITE_URL%/}"
          else
            npx wrangler deploy --var "REPOSITORY:$GITHUB_REPOSITORY"
          fi
