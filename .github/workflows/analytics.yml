name: アクセス解析のサーバーを公開

# アクセス解析の Durable Object を持つ Worker（analytics/）を Cloudflare Workers（無料プラン）に公開する。
# サイト（Cloudflare Pages）の /api（functions/）がこの Durable Object を使う。Worker 自体は workers.dev では公開しない。
# 使うには、リポジトリの Secrets に CLOUDFLARE_API_TOKEN と CLOUDFLARE_ACCOUNT_ID を登録する（README の「公開先」）。
# 登録していなければ何もしない（サイトの公開（update.yml）も、Worker がまだなければ先に公開する）
on:
  push:
    paths:
      - 'analytics/**'
      - '.github/workflows/analytics.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: analytics-deploy
  cancel-in-progress: false

jobs:
  deploy:
    # 既定ブランチだけ（ref_name だと、同じ名前のタグでも当てはまるので refs/heads/ で比べる）
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Cloudflare の設定を確認
        id: config
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo '::notice::Secrets に CLOUDFLARE_API_TOKEN と CLOUDFLARE_ACCOUNT_ID が登録されていないため、アクセス解析のサーバーは公開しません'
            echo 'ready=false' >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.config.outputs.ready == 'true'
        with:
          # push しないので、GitHub のトークンを .git に残さない（2026-10-13 のセキュリティの点検 L5）
          persist-credentials: false

      - name: リポジトリを復号（git-crypt）
        if: steps.config.outputs.ready == 'true'
        env:
          REPO_KEY: ${{ secrets.REPO_KEY }}
        run: |
          if [ -z "$REPO_KEY" ]; then
            echo '::error::Secrets に REPO_KEY（git-crypt の鍵を base64 にしたもの）がありません。登録しないと復号できず、収集・公開ができません'
            exit 1
          fi
          sudo apt-get update -qq && sudo apt-get install -y -qq git-crypt
          printf '%s' "$REPO_KEY" | base64 -d > "$RUNNER_TEMP/repo.key"
          git-crypt unlock "$RUNNER_TEMP/repo.key"
          rm -f "$RUNNER_TEMP/repo.key"

      # 暗号化されているはずのファイルに、平文のファイルが差し込まれていないかを確かめる（update.yml と同じ。git-crypt は平文のファイルを
      # そのまま通すので、リポジトリに書き込めるトークンがあれば、鍵なしでコードを差し込めてしまうため。2026-10-24 のセキュリティの点検）。
      # 平文で置いてよいものは .gitattributes と同じだが、.gitattributes も書き換えられるので、ここに直接書く
      - name: 暗号化されていないファイルがないか確かめる
        if: steps.config.outputs.ready == 'true'
        run: |
          bad=''
          while IFS= read -r -d '' entry; do
            path=${entry#*$'\t'}
            case "$path" in data/* | .github/* | .claude/* | CLAUDE.md | .gitattributes | .gitignore | */.gitattributes | */.gitignore) continue ;; esac
            rest=${entry#* }
            [ "$(git cat-file blob "${rest%% *}" 2>/dev/null | head -c 10 | tr -d '\000')" = GITCRYPT ] || bad="$bad $path"
          done < <(git ls-files -s -z)
          if [ -n "$bad" ]; then
            echo "::error::暗号化されていないファイルがあります（差し込まれたおそれがあるため止めます）:$bad"
            exit 1
          fi

      - uses: actions/setup-node@v7
        if: steps.config.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: analytics/package-lock.json

      - name: 準備・型チェック
        if: steps.config.outputs.ready == 'true'
        working-directory: analytics
        run: |
          # 依存パッケージのインストールのスクリプトは動かさない（update.yml と同じ。wrangler の workerd・esbuild はなくても動く）
          npm ci --ignore-scripts
          npm run check

      - name: 公開
        if: steps.config.outputs.ready == 'true'
        working-directory: analytics
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # 独自ドメインにしたとき（変数 SITE_URL）は、通知の送り主の連絡先もそちらにする
          CUSTOM_SITE_URL: ${{ vars.SITE_URL }}
        run: |
          if [ -n "$CUSTOM_SITE_URL" ]; then
            npx wrangler deploy --var "REPOSITORY:$GITHUB_REPOSITORY" --var "SITE_URL:${CUSTOM_SITE_URL%/}"
          else
            npx wrangler deploy --var "REPOSITORY:$GITHUB_REPOSITORY"
          fi

      # 人の確認（Cloudflare Turnstile）の秘密の鍵: Secrets の TURNSTILE_SECRET_KEY を Worker の秘密の変数 TURNSTILE_SECRET に入れる。
      # 登録していなければ Worker からも消す（確認を求めない）。鍵は標準入力で渡し、ファイルにもログにも残さない
      - name: 人の確認の鍵を設定
        if: steps.config.outputs.ready == 'true'
        working-directory: analytics
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
        run: |
          if [ -n "$TURNSTILE_SECRET_KEY" ]; then
            # 鍵はコマンドの引数に置かない（jq が環境変数から読む）
            jq -n '{TURNSTILE_SECRET: env.TURNSTILE_SECRET_KEY}' | npx wrangler secret bulk
          else
            echo '::notice::Secrets に TURNSTILE_SECRET_KEY がないため、人の確認（Turnstile）は使いません'
            echo '{"TURNSTILE_SECRET": null}' | npx wrangler secret bulk || echo '::warning::Worker から人の確認の鍵を消せませんでした'
          fi
