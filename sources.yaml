# 収集元フィード一覧
# - id:        英数字とハイフンのみ（URLに使われます）
# - name:      サイト上の出典表示名
# - feedUrl:   RSS / Atom フィードのURL
# - siteUrl:   出典サイトのトップURL
# - category:  src/config/site.ts の categories にある slug
# 任意:
# - aggregator: true のとき、他サイトの記事を紹介する集約元（はてブ等）として扱う。
#               同じ記事を配信元自身のフィードでも取得できたら、配信元の情報を優先する
# - stripTitle: タイトルから取り除く部分の正規表現
# - limit:      1回の取得で取り込む記事数の上限（1〜50、既定50）。1日に数百件を配信するサイト向け
# - excerpt:    false のとき抜粋を載せず、見出しとリンクだけにする
# - summary:    false のとき管理画面の AI 要約の候補にしない（規約で記事の要約の掲載を禁じているサイト）
#
# 追加前に必ず各サイトの利用規約を確認してください（商用利用・見出し利用の可否）。
# 確認の結果（登録したサイト・見送ったサイトとその理由）は docs/SOURCES.md に記録しています。
# 例: NHK や Yahoo!ニュースの RSS は非営利目的に限られているため登録していません。

